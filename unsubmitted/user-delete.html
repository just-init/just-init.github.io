<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>계정 삭제 요청 - 내 마음속 사직서 (Unsubmitted)</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{--bg:#111010;--accent:#e8a992;--text:#f5f0eb;--text2:#c4bab2;--text3:#8a807a;--border:rgba(255,255,255,0.06)}
        body{background:var(--bg);color:var(--text2);font-family:'Noto Sans KR',sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}

        nav{padding:20px 48px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}
        .nav-logo{font-family:'Noto Sans KR','Playfair Display',serif;font-size:1.3rem;font-style:italic;color:var(--accent);text-decoration:none}
        .nav-back{color:var(--text3);text-decoration:none;font-size:0.85rem;transition:color 0.3s}
        .nav-back:hover{color:var(--accent)}

        main{flex:1;display:flex;align-items:center;justify-content:center;padding:48px 24px}
        .card{text-align:center;max-width:480px}
        .page-label{font-size:0.7rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--accent);margin-bottom:12px;font-weight:500}
        h1{font-family:'Noto Sans KR','Playfair Display',serif;font-size:2rem;font-weight:700;color:var(--text);margin-bottom:16px;letter-spacing:-0.02em}
        .desc{font-size:0.92rem;font-weight:300;line-height:1.8;margin-bottom:36px}
        .contact{background:rgba(232,169,146,0.06);border:1px solid rgba(232,169,146,0.12);border-radius:16px;padding:28px 32px;font-size:0.95rem;line-height:2}
        .contact-row{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
        .contact-label{color:var(--text3);font-size:0.82rem;font-weight:400}
        .contact-value{color:var(--text);font-weight:500}
        .contact-value a{color:var(--accent);text-decoration:none;transition:opacity 0.3s}
        .contact-value a:hover{opacity:0.7}
        .divider{color:var(--text3);margin:0 4px}

        footer{padding:32px 48px;border-top:1px solid var(--border);text-align:center;font-size:0.75rem;color:var(--text3)}

        @media(max-width:640px){
          nav{padding:16px 20px}
          h1{font-size:1.6rem}
          .contact{padding:20px}
        }
    </style>
</head>
<body>

<nav>
    <a href="index" class="nav-logo">Unsubmitted</a>
    <a href="index" class="nav-back">&larr; 돌아가기</a>
</nav>

<main>
    <div class="card">
        <div class="page-label">Account Deletion</div>
        <h1>계정 및 데이터 삭제 요청</h1>
        <p class="desc">데이터 삭제를 원하시면 아래 연락처로 요청해주세요.<br>확인 후 모든 데이터를 안전하게 삭제해드립니다.</p>
        <div class="contact">
            <div class="contact-row">
                <span class="contact-label">이메일</span>
                <span class="contact-value"><a href="mailto:justinit.service@gmail.com">justinit.service@gmail.com</a></span>
                <span class="divider">|</span>
                <span class="contact-label">연락처</span>
                <span class="contact-value"><a href="tel:010-6822-9802">010-6822-9802</a></span>
            </div>
        </div>
    </div>
</main>

<footer>© 2026 Unsubmitted. All rights reserved.</footer>
</body>
</html>
